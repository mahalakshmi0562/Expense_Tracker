{% extends "expenses/base.html" %}
{% block title %}Add Expense | Expense Award{% endblock %}
{% block content %}
<div class="form-page">
  <a class="back-link" href="{% url 'dashboard' %}">← Back to dashboard</a>
  <div class="form-card"><span class="eyebrow">TRACK YOUR SPENDING</span><h1>Add an expense</h1><p class="muted">Record what you spent so your dashboard stays up to date.</p>
    <form method="post" class="expense-form">{% csrf_token %}
      <label>Expense name<input name="title" maxlength="120" placeholder="e.g. Grocery shopping" required></label>
      <div class="form-row"><label>Amount (₹)<input type="number" name="amount" min="0.01" step="0.01" placeholder="0.00" required></label><label>Date<input type="date" name="date" value="{{ today|date:'Y-m-d' }}" required></label></div>
      <label>Category<select name="category">{% for value,label in categories %}<option value="{{ value }}">{{ label }}</option>{% endfor %}<option>Housing</option><option>Transportation</option><option>Dine Out</option><option>Healthcare</option><option>Entertainment</option><option>Shopping</option><option>Other</option></select></label>
      <label>Notes (optional)<textarea name="notes" rows="3" placeholder="Add a short note"></textarea></label>
      <button class="button full-button" type="submit">Save expense</button>
    </form>
  </div>
</div>
{% endblock %}
